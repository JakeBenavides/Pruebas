version: '3.8'

services:
  db:
    image: mysql:8.3
    container_name: poliservis-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: poliservis
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  app:
    build: .
    container_name: poliservis-app
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - WAIT_HOSTS=db:3306

  jenkins:
    image: jenkins/jenkins:lts
    container_name: poliservis-jenkins
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  mysql-data:
  jenkins-data:
